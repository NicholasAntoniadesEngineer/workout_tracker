<style>
  :root{
    --bg:#101216; --panel:#181b21; --panelHi:#1f242c; --line:#2a2f38;
    --text:#e9ebee; --muted:#8b93a1; --accent:#ffc247; --accentDim:#3a3320; --danger:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;}
  body{padding:max(18px,env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom));}
  .wrap{max-width:640px;margin:0 auto;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;}
  .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;gap:10px;}
  .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700;}
  .h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .h1 .pen{font-size:12px;color:var(--muted);}
  .daysbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:20px;
    padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none;}
  .stats{display:flex;gap:10px;margin:14px 0 18px;}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;}
  .stat .v{font-size:24px;font-weight:800;line-height:1;}
  .stat.big .v{font-size:30px;color:var(--accent);}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .tblwrap{overflow-x:auto;}
  table{border-collapse:separate;border-spacing:6px;width:100%;}
  th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;padding-bottom:2px;}
  th.exh{text-align:left;font-size:11px;}
  .exbtn{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .exbtn.active{background:var(--accentDim);border-color:var(--accent);color:var(--accent);}
  td.cell{min-width:46px;height:40px;text-align:center;border-radius:8px;font-size:16px;font-weight:600;padding:0;}
  td.cell.has{background:var(--panelHi);border:1px solid var(--line);cursor:pointer;}
  td.cell.empty{color:var(--line);}
  td.cell.editing{border:1px solid var(--accent);}
  td.sum{min-width:46px;text-align:center;color:var(--accent);font-weight:700;}
  .panel{margin-top:14px;}
  .prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .plabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .pactive{font-size:15px;font-weight:700;color:var(--accent);}
  .stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;}
  .round{width:56px;height:56px;border-radius:50%;background:var(--panelHi);border:1px solid var(--line);
    color:var(--text);font-size:28px;font-weight:700;cursor:pointer;line-height:1;}
  .repbox{min-width:96px;text-align:center;}
  .repnum{font-size:46px;font-weight:800;line-height:1;}
  .replbl{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
  .quick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
  .q{background:var(--panelHi);color:var(--muted);border:1px solid var(--line);border-radius:8px;
    padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;}
  .q.on{background:var(--accent);color:#1a1200;}
  .btn{border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;flex:1;}
  .btn.log{background:var(--accent);color:#1a1200;border:1px solid var(--accent);width:100%;font-size:17px;padding:14px;}
  .btn.primary{background:var(--accent);color:#1a1200;border:1px solid var(--accent);}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn.dang{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .editrow{display:flex;gap:10px;}
  .chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:5px 6px 5px 12px;font-size:13px;color:var(--muted);}
  .chip .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 2px;}
  .addbtn{background:transparent;border:1px dashed var(--line);color:var(--accent);border-radius:20px;
    padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  input.name{background:var(--panelHi);border:1px solid var(--accent);color:var(--text);border-radius:20px;
    padding:6px 12px;font-size:13px;outline:none;-webkit-user-select:text;user-select:text;}
  .reset{margin-top:22px;text-align:center;}
  .reset button{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;}
  /* history */
  .hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .backbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:20px;
    padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;}
  .newday{background:var(--accent);border:1px solid var(--accent);color:#1a1200;border-radius:20px;
    padding:8px 16px;font-size:13px;font-weight:800;cursor:pointer;}
  .day{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px 12px;margin-bottom:10px;cursor:pointer;}
  .day.cur{border-color:var(--accent);}
  .day .info{flex:1;min-width:0;}
  .day .t{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .day .cur-tag{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1px;}
  .day .nums{text-align:right;flex:none;}
  .day .nums .r{font-size:20px;font-weight:800;color:var(--accent);line-height:1;}
  .day .nums .rl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .day .del{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;flex:none;padding:0 4px;}
  .empty-note{color:var(--muted);font-size:13px;text-align:center;padding:20px;}
  @media (prefers-reduced-motion:no-preference){.exbtn,.q,.round,.btn,.day{transition:all .12s ease;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
  var SEED=["Lunges","Kettlebell swings","Pull ups","Standing kettlebell rows","Shoulder press"];
  var KEY="workout_days_v2";
  var OLDKEY="workout_current_v1";
  var QUICK=[5,8,10,12,15,20];
  var state={sessions:[],sessionId:null,exId:null,reps:10,editing:null,adding:false,view:"log"};

  function todayLabel(){return new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});}
  function shortDate(iso){try{return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});}catch(e){return "";}}
  function uid(){return "i"+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function makeSession(fromEx){
    var names=(fromEx&&fromEx.length)?fromEx.map(function(e){return e.name;}):SEED.slice();
    return {id:uid(),title:todayLabel(),created:new Date().toISOString(),
      ex:names.map(function(n){return {id:uid(),name:n,sets:[]};})};
  }

  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){var d=JSON.parse(raw);if(d.sessions&&d.sessions.length){state.sessions=d.sessions;state.sessionId=d.sessionId||d.sessions[0].id;}}
    }catch(e){}
    if(!state.sessions.length){
      // migrate a v1 single workout if present
      try{var old=localStorage.getItem(OLDKEY);if(old){var od=JSON.parse(old);if(od.ex&&od.ex.length){var s=makeSession(null);s.ex=od.ex;s.title=od.date||todayLabel();state.sessions=[s];}}}catch(e2){}
    }
    if(!state.sessions.length){state.sessions=[makeSession(null)];}
    if(!getSession()){state.sessionId=state.sessions[0].id;}
    var ss=getSession();state.exId=ss.ex.length?ss.ex[0].id:null;
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify({version:2,sessionId:state.sessionId,sessions:state.sessions}));}catch(e){}}

  function getSession(){for(var i=0;i<state.sessions.length;i++)if(state.sessions[i].id===state.sessionId)return state.sessions[i];return null;}
  function activeEx(){var s=getSession();if(!s)return null;for(var i=0;i<s.ex.length;i++)if(s.ex[i].id===state.exId)return s.ex[i];return s.ex[0]||null;}
  function totals(s){var r=0,n=0;s.ex.forEach(function(e){e.sets.forEach(function(x){r+=x;n++;});});return {reps:r,sets:n};}

  function render(){
    if(state.view==="history"){renderHistory();save();return;}
    var s=getSession();var t=totals(s);var a=activeEx();
    var ms=1;s.ex.forEach(function(e){if(e.sets.length>ms)ms=e.sets.length;});

    var h="";
    h+="<div class='head'><div>"+
       "<div class='eyebrow'>Session</div>"+
       "<div class='h1' id='daytitle'>"+esc(s.title)+" <span class='pen'>&#9998;</span></div>"+
       "</div><button class='daysbtn' id='daysbtn'>&#9776; Days ("+state.sessions.length+")</button></div>";

    h+="<div class='stats'>"+
       "<div class='stat big'><div class='v mono'>"+t.reps+"</div><div class='l'>Total reps</div></div>"+
       "<div class='stat'><div class='v mono'>"+t.sets+"</div><div class='l'>Sets</div></div>"+
       "<div class='stat'><div class='v mono'>"+s.ex.length+"</div><div class='l'>Exercises</div></div></div>";

    h+="<div class='card tblwrap'><table><thead><tr><th class='exh'>Exercise</th>";
    for(var i=0;i<ms;i++)h+="<th>S"+(i+1)+"</th>";
    h+="<th>&Sigma;</th></tr></thead><tbody>";
    s.ex.forEach(function(e){
      var sum=e.sets.reduce(function(x,y){return x+y;},0);
      h+="<tr><td><button class='exbtn"+(e.id===state.exId?" active":"")+"' data-ex='"+e.id+"'>"+esc(e.name)+"</button></td>";
      for(var i2=0;i2<ms;i2++){
        var v=e.sets[i2];
        if(v!==undefined){var ed=state.editing&&state.editing.ex===e.id&&state.editing.i===i2;
          h+="<td class='cell has mono"+(ed?" editing":"")+"' data-ex='"+e.id+"' data-i='"+i2+"'>"+v+"</td>";
        } else h+="<td class='cell empty mono'>&middot;</td>";
      }
      h+="<td class='sum mono'>"+(sum||0)+"</td></tr>";
    });
    h+="</tbody></table></div>";

    h+="<div class='card panel'><div class='prow'>"+
       "<div class='plabel'>"+(state.editing?"Editing set":"Logging")+"</div>"+
       "<div class='pactive'>"+(a?esc(a.name):"&mdash;")+"</div></div>";
    h+="<div class='stepper'><button class='round' id='minus'>&minus;</button>"+
       "<div class='repbox'><div class='repnum mono'>"+state.reps+"</div><div class='replbl'>reps</div></div>"+
       "<button class='round' id='plus'>+</button></div>";
    h+="<div class='quick'>";QUICK.forEach(function(n){h+="<button class='q"+(state.reps===n?" on":"")+"' data-q='"+n+"'>"+n+"</button>";});h+="</div>";
    if(state.editing){
      h+="<div class='editrow'><button class='btn primary' id='upd'>Update set</button>"+
         "<button class='btn dang' id='del'>Delete</button>"+
         "<button class='btn ghost' id='cxl'>Cancel</button></div>";
    } else {
      h+="<button class='btn log' id='logbtn'>Log set"+(a?" &rarr; "+esc(a.name):"")+"</button>";
    }
    h+="</div>";

    h+="<div class='chips'>";
    s.ex.forEach(function(e){h+="<span class='chip'>"+esc(e.name)+"<button class='x' data-rm='"+e.id+"'>&times;</button></span>";});
    if(state.adding){h+="<span><input class='name' id='newname' placeholder='Exercise name' autocomplete='off'> <button class='btn primary' id='addok' style='flex:none'>Add</button></span>";}
    else {h+="<button class='addbtn' id='addbtn'>+ Exercise</button>";}
    h+="</div>";

    h+="<div class='reset'><button id='reset'>Clear this day's sets</button></div>";

    document.getElementById("app").innerHTML=h;
    if(state.adding){var nn=document.getElementById("newname");if(nn){nn.focus();nn.addEventListener("keydown",function(ev){if(ev.key==="Enter")addEx();});}}
    save();
  }

  function renderHistory(){
    var h="<div class='hhead'><button class='backbtn' id='backbtn'>&lsaquo; Back</button>"+
          "<button class='newday' id='newday'>+ New day</button></div>"+
          "<div class='hhead' style='margin-top:-4px;margin-bottom:16px'>"+
          "<button class='backbtn' id='exportcsv'>&#8681; Export CSV</button>"+
          "<button class='backbtn' id='importcsv'>&#8679; Import CSV</button></div>"+
          "<input type='file' id='csvfile' accept='.csv,text/csv' style='display:none'>";
    // newest first
    var list=state.sessions.slice().sort(function(a,b){return (b.created||"").localeCompare(a.created||"");});
    if(!list.length){h+="<div class='empty-note'>No days yet.</div>";}
    list.forEach(function(s){
      var t=totals(s);var cur=s.id===state.sessionId;
      h+="<div class='day"+(cur?" cur":"")+"' data-load='"+s.id+"'>"+
         "<div class='info'>"+(cur?"<div class='cur-tag'>Current</div>":"")+
         "<div class='t'>"+esc(s.title)+"</div>"+
         "<div class='sub'>"+shortDate(s.created)+" &middot; "+s.ex.length+" exercises</div></div>"+
         "<div class='nums'><div class='r mono'>"+t.reps+"</div><div class='rl'>reps</div></div>"+
         "<button class='del' data-delday='"+s.id+"'>&times;</button></div>";
    });
    document.getElementById("app").innerHTML=h;
  }

  function addEx(){
    var el=document.getElementById("newname");if(!el){state.adding=false;render();return;}
    var name=el.value.trim();if(!name){state.adding=false;render();return;}
    var s=getSession();var e={id:uid(),name:name,sets:[]};s.ex.push(e);state.exId=e.id;state.adding=false;render();
  }

  function csvField(v){v=String(v==null?"":v);if(/[",\n\r]/.test(v)){v='"'+v.replace(/"/g,'""')+'"';}return v;}
  function buildCSV(){
    var rows=[["Date","Day","Exercise","Set","Reps"]];
    var list=state.sessions.slice().sort(function(a,b){return (a.created||"").localeCompare(b.created||"");});
    list.forEach(function(s){
      s.ex.forEach(function(e){
        if(e.sets.length){e.sets.forEach(function(r,i){rows.push([s.created,s.title,e.name,i+1,r]);});}
        else{rows.push([s.created,s.title,e.name,"",""]);}
      });
    });
    return rows.map(function(r){return r.map(csvField).join(",");}).join("\r\n");
  }
  function parseCSV(text){
    text=text.replace(/^\ufeff/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
    var rows=[],row=[],cur="",i=0,inQ=false,c;
    while(i<text.length){c=text[i];
      if(inQ){if(c=='"'){if(text[i+1]=='"'){cur+='"';i++;}else inQ=false;}else cur+=c;}
      else{if(c=='"')inQ=true;else if(c==","){row.push(cur);cur="";}
        else if(c=="\n"){row.push(cur);rows.push(row);row=[];cur="";}else cur+=c;}
      i++;}
    if(cur!==""||row.length){row.push(cur);rows.push(row);}
    return rows;
  }
  function dl(csv,fname){
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});var url=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
  }
  function exportCSV(){
    var csv="\ufeff"+buildCSV();
    var fname="workout-history-"+new Date().toISOString().slice(0,10)+".csv";
    try{var file=new File([csv],fname,{type:"text/csv"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Workout history"}).catch(function(){dl(csv,fname);});return;}
    }catch(e){}
    dl(csv,fname);
  }
  function importText(text){
    var rows=parseCSV(text).filter(function(r){return !(r.length===1&&r[0]==="");});
    if(!rows.length){alert("That file looks empty.");return;}
    var head=rows[0].map(function(x){return x.trim().toLowerCase();});
    var iDate=head.indexOf("date"),iDay=head.indexOf("day"),iEx=head.indexOf("exercise"),iSet=head.indexOf("set"),iReps=head.indexOf("reps");
    if(iDate<0||iEx<0||iReps<0){alert("Couldn't find the expected columns. Keep the header row: Date, Day, Exercise, Set, Reps.");return;}
    var groups={},order=[];
    for(var r=1;r<rows.length;r++){var row=rows[r];if(!row.length)continue;
      var key=(row[iDate]||"").trim();if(!key)continue;
      var day=(iDay>=0?(row[iDay]||""):"");
      var exn=(row[iEx]||"").trim();if(!exn)continue;
      var setn=parseInt((row[iSet]||"").trim(),10);
      var repsRaw=(row[iReps]||"").trim();
      if(!groups[key]){groups[key]={created:key,title:day||key,ex:[],map:{}};order.push(key);}
      var g=groups[key];
      if(!g.map[exn]){g.map[exn]={name:exn,tmp:[]};g.ex.push(g.map[exn]);}
      if(repsRaw!==""){var rp=parseInt(repsRaw,10);if(!isNaN(rp))g.map[exn].tmp.push({i:isNaN(setn)?g.map[exn].tmp.length+1:setn,r:rp});}
    }
    var imported=order.map(function(k){var g=groups[k];
      var exs=g.ex.map(function(e){e.tmp.sort(function(a,b){return a.i-b.i;});return {id:uid(),name:e.name,sets:e.tmp.map(function(o){return o.r;})};});
      return {id:uid(),title:g.title,created:g.created,ex:exs};});
    if(!imported.length){alert("No workout rows found in that file.");return;}
    var keys={};imported.forEach(function(s){keys[s.created]=true;});
    var kept=state.sessions.filter(function(s){return !keys[s.created];});
    state.sessions=kept.concat(imported);
    var newest=state.sessions.slice().sort(function(a,b){return (b.created||"").localeCompare(a.created||"");})[0];
    state.sessionId=newest.id;var ss=getSession();state.exId=ss.ex[0]?ss.ex[0].id:null;
    state.view="history";render();
    alert("Imported "+imported.length+" day"+(imported.length>1?"s":"")+".");
  }

  document.body.addEventListener("change",function(ev){
    if(ev.target&&ev.target.id==="csvfile"){
      var f=ev.target.files&&ev.target.files[0];if(!f){return;}
      var rd=new FileReader();rd.onload=function(){importText(String(rd.result));};rd.readAsText(f);
      ev.target.value="";
    }
  });

  document.body.addEventListener("click",function(ev){
    var t=ev.target;
    // history view actions
    var delEl=t.closest?t.closest("[data-delday]"):null;
    if(delEl){var id=delEl.getAttribute("data-delday");
      if(confirm("Delete this day permanently?")){
        state.sessions=state.sessions.filter(function(x){return x.id!==id;});
        if(!state.sessions.length){state.sessions=[makeSession(null)];}
        if(state.sessionId===id){state.sessionId=state.sessions[0].id;var ss=getSession();state.exId=ss.ex[0]?ss.ex[0].id:null;}
      }
      render();return;}
    var loadEl=t.closest?t.closest("[data-load]"):null;
    if(loadEl){state.sessionId=loadEl.getAttribute("data-load");var s0=getSession();state.exId=s0.ex[0]?s0.ex[0].id:null;state.editing=null;state.view="log";render();return;}
    if(t.id==="backbtn"){state.view="log";render();return;}
    if(t.id==="newday"){var cur=getSession();var ns=makeSession(cur?cur.ex:null);state.sessions.push(ns);state.sessionId=ns.id;state.exId=ns.ex[0]?ns.ex[0].id:null;state.editing=null;state.view="log";render();return;}
    if(t.id==="daysbtn"){state.view="history";render();return;}
    if(t.id==="exportcsv"){exportCSV();return;}
    if(t.id==="importcsv"){var cf=document.getElementById("csvfile");if(cf)cf.click();return;}
    // title rename
    if(t.closest&&t.closest("#daytitle")){var s1=getSession();var nt=prompt("Name this day",s1.title);if(nt!==null){nt=nt.trim();if(nt)s1.title=nt;}render();return;}
    // logging view actions
    if(t.id==="minus"){state.reps=Math.max(0,state.reps-1);render();return;}
    if(t.id==="plus"){state.reps=state.reps+1;render();return;}
    if(t.dataset&&t.dataset.q){state.reps=parseInt(t.dataset.q,10);render();return;}
    if(t.dataset&&t.dataset.ex&&t.classList.contains("exbtn")){state.exId=t.dataset.ex;state.editing=null;render();return;}
    if(t.classList&&t.classList.contains("cell")&&t.classList.contains("has")){
      var s2=getSession();var e2=null;s2.ex.forEach(function(x){if(x.id===t.dataset.ex)e2=x;});
      state.exId=t.dataset.ex;state.reps=e2.sets[parseInt(t.dataset.i,10)];state.editing={ex:t.dataset.ex,i:parseInt(t.dataset.i,10)};render();return;}
    if(t.id==="logbtn"){var a=activeEx();if(a)a.sets.push(state.reps);render();return;}
    if(t.id==="upd"){var ed=state.editing;var s3=getSession();s3.ex.forEach(function(x){if(x.id===ed.ex)x.sets[ed.i]=state.reps;});state.editing=null;render();return;}
    if(t.id==="del"){var ed2=state.editing;var s4=getSession();s4.ex.forEach(function(x){if(x.id===ed2.ex)x.sets.splice(ed2.i,1);});state.editing=null;render();return;}
    if(t.id==="cxl"){state.editing=null;render();return;}
    if(t.dataset&&t.dataset.rm){var s5=getSession();s5.ex=s5.ex.filter(function(x){return x.id!==t.dataset.rm;});if(state.exId===t.dataset.rm)state.exId=s5.ex[0]?s5.ex[0].id:null;render();return;}
    if(t.id==="addbtn"){state.adding=true;render();return;}
    if(t.id==="addok"){addEx();return;}
    if(t.id==="reset"){if(confirm("Clear all sets for this day?")){var s6=getSession();s6.ex.forEach(function(x){x.sets=[];});state.editing=null;render();}return;}
  });

  load();render();
})();
</script>
</body>
</html>
